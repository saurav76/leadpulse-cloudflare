name: Deploy LeadPulse preview
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LEADPULSE_D1_DATABASE_ID: ${{ vars.LEADPULSE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          test -n "$LEADPULSE_D1_DATABASE_ID" || { echo 'Missing D1 UUID'; exit 1; }
          node --input-type=module -e 'import fs from "node:fs"; const p="wrangler.jsonc"; const x=fs.readFileSync(p,"utf8"); if(!x.includes("REPLACE_WITH_D1_DATABASE_UUID")) throw Error("Expected DB UUID placeholder absent"); fs.writeFileSync(p, x.replace("REPLACE_WITH_D1_DATABASE_UUID",process.env.LEADPULSE_D1_DATABASE_ID));'
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply leadpulse-db --remote --yes
      - name: Deploy read-only preview
        run: npx wrangler deploy
