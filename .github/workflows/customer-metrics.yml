name: LeadPulse customer metrics (private)
on:
  workflow_dispatch:
  schedule:
    - cron: '31 5 * * *'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      LEADPULSE_D1_DATABASE_ID: ${{ vars.LEADPULSE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch aggregate D1 customer and acquisition metrics
        run: node scripts/customer-metrics.mjs
